<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore — dockerpatch</title>
<style>
:root{
  --blue:#1d63ed; --blue-dark:#003e91; --blue-light:#e9f2ff;
  --bg:#f4f5f7; --card:#ffffff; --border:#e2e5ea;
  --txt:#0b1c2c; --sub:#5b6b7c; --sub2:#8894a3;
  --code-bg:#0b1c2c; --code-txt:#c9f0ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#4f86ff; --blue-dark:#0a1120; --blue-light:#152238;
    --bg:#0a0e14; --card:#131a24; --border:#232c3a;
    --txt:#e8edf4; --sub:#93a1b3; --sub2:#5f6d80;
    --code-bg:#000; --code-txt:#8fe0ff;
  }
}
:root[data-theme="dark"]{
  --blue:#4f86ff; --blue-dark:#0a1120; --blue-light:#152238;
  --bg:#0a0e14; --card:#131a24; --border:#232c3a;
  --txt:#e8edf4; --sub:#93a1b3; --sub2:#5f6d80;
  --code-bg:#000; --code-txt:#8fe0ff;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; color:var(--txt); background:var(--bg); transition:background .15s, color .15s;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.navbar{
  background:var(--blue-dark); color:#fff; display:flex; align-items:center;
  gap:18px; padding:0 24px; height:56px; position:sticky; top:0; z-index:20;
}
.navbar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; text-decoration:none; color:#fff; flex-shrink:0;}
.navbar .logo .mark{
  width:26px; height:26px; border-radius:7px; background:#fff; color:var(--blue-dark);
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.navlinks{display:flex; gap:2px; flex:1; overflow-x:auto;}
.navlinks a{
  color:rgba(255,255,255,0.75); text-decoration:none; font-size:13.5px; font-weight:600;
  padding:8px 12px; border-radius:6px; white-space:nowrap; transition:background .12s, color .12s;
}
.navlinks a:hover{background:rgba(255,255,255,0.1); color:#fff;}
.navlinks a.active{background:rgba(255,255,255,0.16); color:#fff;}

.hero{
  background:var(--blue); padding:32px 20px 84px; text-align:center; color:#fff;
}
.hero h1{margin:0 0 6px; font-size:26px; font-weight:700;}
.hero p{margin:0; font-size:14px; opacity:.92;}

.searchwrap{max-width:640px; margin:-52px auto 0; padding:0 20px 24px;}
.searchbar{
  display:flex; background:#fff; border-radius:10px; box-shadow:0 6px 24px rgba(0,20,60,0.18);
}
.searchbar svg{flex-shrink:0; margin:0 6px 0 18px; align-self:center; color:var(--sub2);}
.searchbar input{
  flex:1; border:none; outline:none; padding:16px 12px; font-size:15px; color:var(--txt); background:transparent;
}
.searchbar input::placeholder{color:var(--sub2);}

.body{max-width:1040px; margin:0 auto; padding:0 20px 60px; display:flex; gap:24px;}
.sidebar{width:200px; flex-shrink:0;}
.sidebar h3{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--sub2); margin:18px 0 8px;}
.catlist{display:flex; flex-direction:column; gap:2px;}
.catbtn{
  text-align:left; background:none; border:none; padding:7px 10px; border-radius:6px;
  font-size:13.5px; color:var(--sub); cursor:pointer; display:flex; justify-content:space-between;
}
.catbtn:hover{background:var(--blue-light); color:var(--txt);}
.catbtn.active{background:var(--blue-light); color:var(--blue); font-weight:700;}
.catbtn .n{color:var(--sub2); font-weight:400;}

.main{flex:1; min-width:0;}
.count{color:var(--sub); font-size:13px; margin:16px 0 12px;}
.list{display:flex; flex-direction:column; gap:10px;}
.pkg{
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; display:flex; gap:14px; cursor:pointer; transition:box-shadow .12s, border-color .12s;
}
.pkg:hover{box-shadow:0 2px 10px rgba(0,20,60,0.07); border-color:#cdd6e0;}
.pkg .icon{
  width:44px; height:44px; border-radius:9px; background:var(--blue-light); color:var(--blue);
  display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; font-weight:700;
}
.pkg .info{flex:1; min-width:0;}
.pkg .name{font-size:15.5px; font-weight:700; color:var(--blue-dark);}
.pkg .cat-tag{
  display:inline-block; margin-left:8px; font-size:10.5px; font-weight:700; color:var(--sub2);
  background:var(--bg); border-radius:4px; padding:2px 6px; text-transform:uppercase; letter-spacing:.03em;
}
.pkg .desc{color:var(--sub); font-size:13px; margin-top:3px; line-height:1.4;}
.pkg .cmd{
  font-family:"SF Mono",ui-monospace,monospace; font-size:11.5px; color:var(--sub2);
  align-self:center; white-space:nowrap; flex-shrink:0;
}
.loading{color:var(--sub); text-align:center; padding:60px 0; font-size:14px;}

.overlay{
  position:fixed; inset:0; background:rgba(10,20,35,0.55);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:30;
}
.overlay.show{display:flex;}
.modal{
  background:#fff; border-radius:14px; max-width:640px; width:100%; max-height:82vh;
  overflow-y:auto; padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal h2{margin:0 0 4px; font-size:20px; color:var(--blue-dark);}
.modal .mdesc{color:var(--sub); font-size:14px; margin-bottom:4px;}
.modal .mcat{color:var(--sub2); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:16px;}
.modal .cmdbox{
  background:var(--code-bg); color:var(--code-txt); border-radius:8px; padding:12px 14px;
  font-family:"SF Mono",ui-monospace,monospace; font-size:13px; margin-bottom:16px; word-break:break-all;
}
.modal pre{
  background:var(--bg); border:1px solid var(--border); border-radius:10px;
  padding:14px; font-size:12px; line-height:1.5; overflow-x:auto; color:var(--sub);
  font-family:"SF Mono",ui-monospace,monospace; white-space:pre-wrap;
}
.closebtn{
  float:right; background:none; border:none; color:var(--sub2); font-size:22px; cursor:pointer; line-height:1;
}
.themebtn{
  background:rgba(255,255,255,0.1); border:none; color:#fff; border-radius:6px;
  padding:7px 10px; font-size:14px; cursor:pointer; flex-shrink:0; margin-left:auto;
}
.themebtn:hover{background:rgba(255,255,255,0.18);}
</style>
</head>
<body>
<div class="navbar">
  <a class="logo" href="index.html"><span class="mark">📦</span>dockerpatch</a>
  <div class="navlinks">
    <a href="browse.html" class="active">Explore</a>
    <a href="findinstalls.html">Find install-id</a>
    <a href="submit.html">Submit repo</a>
    <a href="docs.html">Docs</a>
    <a href="whyuse.html">Why dockerpatch</a>
    <a href="faq.html">FAQ</a>
    <a href="https://github.com/Luishae07/dockerpatch">GitHub</a>
  </div>
  <button class="themebtn" id="themeBtn">🌙</button>
</div>

<div class="hero">
  <h1>Explore the catalog</h1>
  <p>Hundreds of self-hostable apps, one command away.</p>
</div>

<div class="searchwrap">
  <div class="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" placeholder="Search packages...">
  </div>
</div>

<div class="body">
  <div class="sidebar">
    <h3>Categories</h3>
    <div class="catlist" id="catlist"></div>
  </div>
  <div class="main">
    <div class="count" id="count"></div>
    <div class="list" id="list"><div class="loading">Loading catalog…</div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
let PKGS = [];
let BASE = '';
let activeCat = 'All';

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return name.slice(0,2).toUpperCase();
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = document.getElementById('list');
  let filtered = PKGS.filter(p => activeCat === 'All' || p.category === activeCat);
  if (q){
    filtered = filtered.filter(p =>
      p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q)
    );
  }
  document.getElementById('count').textContent = `${filtered.length} results`;
  if (!filtered.length){
    list.innerHTML = '<div class="loading">No matches.</div>';
    return;
  }
  list.innerHTML = filtered.slice(0, 300).map(p => `
    <div class="pkg" data-name="${esc(p.name)}">
      <div class="icon">${esc(initials(p.name))}</div>
      <div class="info">
        <span class="name">${esc(p.name)}</span><span class="cat-tag">${esc(p.category||'')}</span>
        <div class="desc">${esc(p.description||'')}</div>
      </div>
      <div class="cmd">docker install ${esc(p.name)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.pkg').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.name));
  });
}

function renderCatlist(){
  const counts = {};
  PKGS.forEach(p => { counts[p.category || 'Other'] = (counts[p.category || 'Other'] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort((a,b) => counts[b]-counts[a])];
  const el = document.getElementById('catlist');
  el.innerHTML = cats.map(c => {
    const n = c === 'All' ? PKGS.length : counts[c];
    return `<button class="catbtn ${c===activeCat?'active':''}" data-cat="${esc(c)}"><span>${esc(c)}</span><span class="n">${n}</span></button>`;
  }).join('');
  el.querySelectorAll('.catbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCat = btn.dataset.cat;
      renderCatlist();
      render();
    });
  });
}

async function openModal(name){
  const pkg = PKGS.find(p => p.name === name);
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="closebtn" id="closeBtn">&times;</button>
    <h2>${esc(pkg.name)}</h2>
    <div class="mdesc">${esc(pkg.description||'')}</div>
    <div class="mcat">${esc(pkg.category||'')}</div>
    <div class="cmdbox">docker install ${esc(pkg.name)}</div>
    <pre id="scriptBody">Loading script…</pre>
  `;
  overlay.classList.add('show');
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  try {
    const info = await (await fetch(BASE + pkg.info_url)).text();
    const script = await (await fetch(BASE + info.trim())).text();
    document.getElementById('scriptBody').textContent = script;
  } catch(e){
    document.getElementById('scriptBody').textContent = 'Could not load script.';
  }
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeModal();
});

async function init(){
  BASE = (await (await fetch('tunnel-url.txt')).text()).trim();
  PKGS = await (await fetch(BASE + '/api/list')).json();
  PKGS.sort((a,b) => a.name.localeCompare(b.name));
  renderCatlist();
  render();
}
document.getElementById('q').addEventListener('input', render);

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('dp-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
const savedTheme = localStorage.getItem('dp-theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(savedTheme);
document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

init();
</script>
</body>
</html>
